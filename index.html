<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#070605">
  <title>Bích Châu và Giao Thần</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #050b11;
      --gold: #d4a359;
      --gold-dim: rgba(212, 163, 89, 0.25);
      --dialog-bg: linear-gradient(180deg, rgba(10, 20, 30, 0.94) 0%, rgba(5, 11, 17, 0.98) 100%);
      --text: #f0f4f8;
      --text-muted: #94a3b8;
      --accent: #e2bd79;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      background: #020406;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow: hidden;
    }

    /* Khung màn hình game thích ứng cả Desktop lẫn Mobile */
    .vn-container {
      position: relative;
      width: 100vw;
      height: 100dvh;
      max-width: 1200px;
      max-height: 850px;
      background: #081119;
      border: 1px solid var(--gold-dim);
      border-radius: 16px;
      box-shadow: 0 0 55px rgba(0, 0, 0, 0.95);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    @media (min-width: 769px) {
      .vn-container {
        height: auto;
        aspect-ratio: 16 / 10;
      }
    }

    /* MÀN HÌNH KHỞI ĐỘNG (HERO) */
    .hero-layer {
      position: absolute;
      inset: 0;
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: clamp(20px, 5vw, 40px);
      background: radial-gradient(circle at center, rgba(14, 38, 54, 0.95), rgba(4, 10, 16, 0.98));
    }
    .hero-eyebrow {
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: .25em;
      font-size: clamp(0.7rem, 2vw, 0.85rem);
      font-weight: 700;
      margin-bottom: 12px;
    }
    .hero-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2rem, 6vw, 3.8rem);
      line-height: 1.15;
      color: #fff;
      margin-bottom: 16px;
    }
    .hero-desc {
      color: var(--text-muted);
      max-width: 600px;
      font-size: clamp(0.9rem, 2.5vw, 1.05rem);
      line-height: 1.6;
      margin-bottom: 26px;
    }
    .start-btn {
      background: linear-gradient(135deg, rgba(226, 189, 121, 0.25), rgba(226, 189, 121, 0.05));
      border: 1px solid var(--gold);
      color: var(--gold);
      padding: 12px 36px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 99px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(226, 189, 121, 0.2);
      transition: all 0.3s ease;
    }
    .start-btn:hover {
      background: var(--gold);
      color: #071721;
      box-shadow: 0 0 30px rgba(226, 189, 121, 0.5);
      transform: translateY(-2px);
    }

    /* HUD TRÊN CAO (TOP BAR) */
    .top-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: clamp(10px, 2.5vw, 20px);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      z-index: 10;
      pointer-events: none;
      gap: 8px;
    }

    /* Thẻ chỉ số bóng tròn (Pips) */
    .stats-card {
      background: rgba(8, 16, 24, 0.88);
      border: 1px solid rgba(212, 163, 89, 0.25);
      border-radius: 12px;
      padding: 8px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      backdrop-filter: blur(10px);
      pointer-events: auto;
    }
    .stat-row {
      display: flex;
      align-items: center;
      font-size: clamp(0.75rem, 2vw, 0.84rem);
      font-weight: 600;
      gap: 12px;
      justify-content: space-between;
    }
    .stat-name.trust { color: #facc15; }
    .stat-name.evidence { color: #38bdf8; }
    .stat-name.support { color: #4ade80; }

    .dots { display: flex; gap: 4px; }
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.3s;
    }
    .dot.active-gold { background: #facc15; box-shadow: 0 0 8px #facc15; }
    .dot.active-blue { background: #38bdf8; box-shadow: 0 0 8px #38bdf8; }
    .dot.active-green { background: #4ade80; box-shadow: 0 0 8px #4ade80; }

    /* Thanh nút điều khiển */
    .control-actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: flex-end;
      pointer-events: auto;
    }
    .ctrl-btn {
      background: rgba(10, 20, 30, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: #cbd5e1;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: clamp(0.7rem, 1.8vw, 0.82rem);
      cursor: pointer;
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s ease;
      white-space: nowrap;
    }
    .ctrl-btn:hover {
      border-color: var(--gold);
      color: #fff;
      background: rgba(212, 163, 89, 0.15);
    }

/* KHUNG HIỂN THỊ HÌNH ẢNH MINH HỌA */
    .stage {
      position: absolute;
      top: 70px;
      left: 0;
      right: 0;
      bottom: 330px;
      display: flex;
      align-items: flex-end;
      padding: 0 8%;
      pointer-events: none;
      z-index: 1;
    }

    /* MẶC ĐỊNH CHO CÁC CẢNH CÒN LẠI (finalChoice, ending_*): NẰM CHÍNH GIỮA */
    .character-portrait {
      width: auto;
      max-width: 460px;
      height: 100%;
      max-height: 320px;
      object-fit: cover;
      border-radius: 12px;
      border: 1px solid rgba(212, 163, 89, 0.4);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.85), 0 0 16px rgba(212, 163, 89, 0.15);
      transition: margin 0.35s ease, opacity 0.3s ease;
      margin: 0 auto; /* CĂN GIỮA */
    }

    /* KHI LÀ BÍCH CHÂU -> ĐẨY SANG TRÁI */
    .stage.align-left .character-portrait {
      margin-left: 0;
      margin-right: auto;
    }

    /* KHI LÀ GIAO THẦN -> ĐẨY SANG PHẢI */
    .stage.align-right .character-portrait {
      margin-left: auto;
      margin-right: 0;
    }

    /* TRÊN ĐIỆN THOẠI (DƯỚI 768px): TẤT CẢ LUÔN Ở GIỮA */
    @media (max-width: 768px) {
      .stage {
        top: 60px;
        bottom: 52%;
        padding: 0;
        justify-content: center;
        align-items: center;
      }
      .character-portrait,
      .stage.align-left .character-portrait,
      .stage.align-right .character-portrait {
        margin: 0 auto !important;
        max-width: 82%;
        max-height: 90%;
        height: auto;
      }
    }

    /* HỘP THOẠI DIALOGUE DƯỚI CÙNG */
    .dialogue-wrapper {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 320px; /* Tăng chiều cao lên 320px để chứa hết văn bản dài */
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 18px 36px 18px;
      background: var(--dialog-bg);
      border-top: 1px solid rgba(212, 163, 89, 0.3);
      backdrop-filter: blur(14px);
      z-index: 20;
      cursor: pointer;
    }

    /* VÙNG CHỨA CHỮ: BỎ THANH CUỘN CHUỘT */
    .dialogue-text {
      color: var(--text);
      font-size: 1.05rem;
      line-height: 1.6;
      font-weight: 400;
      overflow-y: hidden; /* Tắt thanh cuộn chuột hoàn toàn */
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center; /* Căn nội dung cân đối ở giữa hộp thoại khi ít chữ */
    }

    .dialogue-text p { 
      margin-bottom: 8px; 
    }

    .dialogue-text .dialogue {
      border-left: 3px solid var(--gold);
      margin: 8px 0;
      color: #f6e8cc;
      background: rgba(212, 163, 89, 0.05);
      border-radius: 0 8px 8px 0;
      padding: 8px 12px;
      font-size: 0.98em;
    }

    .char-badge {
      display: inline-block;
      padding: 3px 12px;
      border: 1px solid var(--gold);
      border-radius: 6px;
      color: var(--gold);
      font-size: clamp(0.85rem, 2vw, 0.95rem);
      font-weight: 700;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
      background: rgba(212, 163, 89, 0.1);
    }
    .chapter-tag {
      float: right;
      font-size: clamp(0.7rem, 1.8vw, 0.8rem);
      color: var(--gold);
      border: 1px solid var(--gold-dim);
      padding: 2px 8px;
      border-radius: 99px;
    }
    .dialogue-text {
      color: var(--text);
      font-size: clamp(0.95rem, 2.3vw, 1.1rem);
      line-height: 1.6;
      font-weight: 400;
    }
    .dialogue-text p { margin-bottom: 6px; }
    .dialogue-text .dialogue {
      border-left: 3px solid var(--gold);
      margin: 8px 0;
      color: #f6e8cc;
      background: rgba(212, 163, 89, 0.05);
      border-radius: 0 8px 8px 0;
      padding: 6px 10px;
      font-size: 0.95em;
    }

    .dialogue-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
    }
    .hint-text {
      font-size: clamp(0.72rem, 1.8vw, 0.8rem);
      color: var(--text-muted);
    }
    .next-arrow {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(255, 255, 255, 0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--gold);
      font-size: 0.85rem;
      animation: pulse 1.6s infinite;
      flex-shrink: 0;
    }

    /* OVERLAY MENU LỰA CHỌN RẼ NHÁNH */
    .choices-overlay {
      position: absolute;
      inset: 0;
      background: rgba(3, 7, 12, 0.78);
      backdrop-filter: blur(8px);
      z-index: 30;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 12px;
      padding: 16px;
      overflow-y: auto;
    }
    .choice-card {
      width: 100%;
      max-width: 680px;
      background: rgba(14, 25, 36, 0.95);
      border: 1px solid rgba(212, 163, 89, 0.3);
      padding: 12px 16px;
      border-radius: 12px;
      color: #fff;
      cursor: pointer;
      font-size: clamp(0.9rem, 2.2vw, 1rem);
      transition: all 0.22s ease;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .choice-card:hover, .choice-card:active {
      border-color: var(--gold);
      background: rgba(212, 163, 89, 0.2);
      transform: translateX(4px);
    }
    .choice-badge {
      font-family: 'Cinzel', serif;
      font-weight: 700;
      color: var(--gold);
      border: 1px solid var(--gold-dim);
      padding: 4px 10px;
      border-radius: 6px;
      flex-shrink: 0;
    }
    .choice-info strong { display: block; margin-bottom: 2px; }
    .choice-info small { color: var(--text-muted); font-size: 0.84rem; display: block; }

    .hidden { display: none !important; }

    /* CẤU HÌNH DÀNH RIÊNG CHO ĐIỆN THOẠI (DƯỚI 768px) */
    @media (max-width: 768px) {
      .vn-container {
        border-radius: 0;
        border: none;
      }
      .top-bar {
        align-items: center;
        background: linear-gradient(180deg, rgba(4, 9, 14, 0.9) 0%, transparent 100%);
      }
      .stats-card {
        padding: 6px 10px;
        gap: 4px;
      }
      .stat-row { width: auto; gap: 8px; font-size: 0.72rem; }
      .control-actions { gap: 4px; }
      .ctrl-btn { padding: 5px 8px; font-size: 0.72rem; }

      /* Canh chỉnh ảnh minh họa lên nửa trên màn hình */
      .stage {
        justify-content: center;
        align-items: center;
        padding-right: 0;
        padding-bottom: 38%;
        top: 60px;
      }
      .character-portrait {
        max-width: 82%;
        max-height: 38vh;
        border-radius: 10px;
      }

      /* Hộp thoại chiếm nửa dưới vừa vặn ngón tay cái */
      .dialogue-wrapper {
        max-height: 48%;
        padding: 14px 16px;
      }
      .dialogue-text {
        font-size: 0.95rem;
        line-height: 1.55;
      }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.1); opacity: 1; border-color: var(--gold); }
    }
  </style>
</head>
<body>

  <div class="vn-container" id="game-screen">
    
    <!-- MÀN HÌNH KHỞI ĐỘNG -->
    <section class="hero-layer" id="hero-layer">
      <div class="hero-eyebrow">Truyền thuyết · Lòng can đảm · Biển cả</div>
      <h1 class="hero-title">Bích Châu và Giao Thần</h1>
      <p class="hero-desc">Một câu chuyện tương tác về lòng trắc ẩn, trách nhiệm và cuộc đối thoại giữa con người với biển cả.</p>
      <button id="start-game-btn" type="button" class="start-btn">Khởi đầu hành trình →</button>
    </section>

    <!-- TOP HUD -->
    <header class="top-bar">
      <div class="stats-card">
        <div class="stat-row">
          <span class="stat-name trust">👑 Niềm Tin</span>
          <div class="dots" id="dots-trust"></div>
        </div>
        <div class="stat-row">
          <span class="stat-name evidence">🧭 Bằng Chứng</span>
          <div class="dots" id="dots-evidence"></div>
        </div>
        <div class="stat-row">
          <span class="stat-name support">🛡️ Dân Làng</span>
          <div class="dots" id="dots-support"></div>
        </div>
      </div>

      <div class="control-actions">
        <button class="ctrl-btn" type="button" id="back-btn">← Lùi</button>
        <button class="ctrl-btn" type="button" id="audio-toggle">🔊 Nhạc</button>
        <button class="ctrl-btn" type="button" id="fs-btn">⛶</button>
        <button class="ctrl-btn" type="button" id="home-btn">↺ Đầu</button>
      </div>
    </header>

    <!-- KHUNG ẢNH MINH HỌA -->
    <div class="stage">
      <img id="char-img" class="character-portrait" src="./img/giao_than.png" alt="Minh họa">
    </div>

    <!-- HỘP THOẠI DIALOGUE -->
    <div class="dialogue-wrapper" id="dialogue-box">
      <div style="overflow: hidden; margin-bottom: 4px;">
        <div class="char-badge" id="speaker-name">Giao Thần</div>
        <span class="chapter-tag" id="chapter-name">Giai đoạn 1</span>
      </div>
      <div class="dialogue-text" id="dialogue-body"></div>
      <div class="dialogue-footer">
        <span class="hint-text">Chạm vào hộp thoại để chọn tiếp</span>
        <div class="next-arrow">❯</div>
      </div>
    </div>

    <!-- OVERLAY MENU LỰA CHỌN -->
    <div class="choices-overlay hidden" id="choices-menu"></div>
  </div>

  <!-- Audio nền -->
  <audio id="bg-audio" loop preload="auto">
    <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_8b3f1c1d3a.mp3?filename=ocean-waves-112906.mp3" type="audio/mpeg">
  </audio>

  <script>
    const initialState = () => ({
      passage: "start",
      history: [],
      trust: 0,
      evidence: false,
      support: false,
      covenant: false,
      temporary: false,
      brave: false,
      path: ""
    });

    let state = initialState();
    let audioEnabled = true;
    let audioCtx = null;

    // DANH SÁCH ẢNH NỘI BỘ
    const sceneImages = {
      start: "./img/giao_than.png",
      a1: "./img/bich_chau.png",
      a2: "./img/giao_than.png",
      b1: "./img/bich_chau.png",
      b2: "./img/giao_than.png",
      c1: "./img/giao_than.png",
      c2: "./img/giao_than.png",
      stage3: "./img/finalChoice.png",
      finalChoice: "./img/finalChoice.png",
      ending_good: "./img/ending_good.png",
      ending_guardian: "./img/ending_guardian.png",
      ending_conditional: "./img/ending_conditional.png",
      ending_fragile: "./img/ending_fragile.png",
      ending_bad: "./img/ending_bad.png",
      ending_sacrifice: "./img/ending_sacrifice.png"
    };

    // NỘI DUNG TẤT CẢ CÁC ĐOẠN PASSAGES VÀ HỘI THOẠI
    const passages = {
      start: {
        stage: 1, chapter: "Giai đoạn 1 · Mở đầu", pill: "Khởi đầu", speaker: "Giao Thần & Bích Châu",
        title: "Cuộc gặp gỡ định mệnh",
        text: `
          <p>Mây đen phủ kín bầu trời. Sóng biển cuồn cuộn, khiến dân làng hoảng sợ. Giao thần nổi giận vì con người đã khai thác biển cả quá mức, làm tổn hại đến sinh vật và môi trường dưới nước.</p>
          <p>Để cứu dân làng, Bích Châu quyết định một mình đến gặp Giao thần.</p>
          <div class="dialogue"><p><strong>Giao thần:</strong> “Con người đã nhiều lần làm tổn thương biển cả. Nếu không có sự trừng phạt, liệu các ngươi có bao giờ biết hối hận?”</p><p><strong>Bích Châu:</strong> “Xin ngài hãy cho con người một cơ hội. Thay vì hy sinh những người vô tội, chúng ta có thể tìm ra giải pháp khác.”</p><p><strong>Giao thần:</strong> “Hãy chứng minh rằng lời nói của ngươi có ý nghĩa.”</p></div>
          <p>Bích Châu cần chọn cách tiếp cận Giao thần.</p>`,
        choices: [
          { title: "Con đường đàm phán", desc: "Bình tĩnh thương lượng và đề nghị lập giao ước.", label: "A", next: "a1", action: () => { state.path = "A"; state.trust += 1; } },
          { title: "Tìm hiểu sự thật", desc: "Điều tra nguyên nhân khiến Giao thần nổi giận.", label: "B", next: "b1", action: () => { state.path = "B"; } },
          { title: "Dùng lý lẽ thuyết phục", desc: "Thách thức quan điểm của Giao thần bằng lý trí.", label: "C", next: "c1", action: () => { state.path = "C"; state.brave = true; } }
        ]
      },
      a1: {
        stage: 2, chapter: "Giai đoạn 2 · Nhánh A", pill: "Đàm phán", speaker: "Giao Thần",
        title: "Lời hứa trước biển cả",
        text: `<p>Bích Châu cúi đầu trước Giao thần nhưng vẫn giữ vững lập trường.</p><div class="dialogue"><p><strong>Bích Châu:</strong> “Con người đã mắc sai lầm, nhưng nếu ngài chỉ trừng phạt, nỗi oán giận sẽ ngày càng lớn. Xin hãy cho chúng con cơ hội sửa chữa.”</p><p><strong>Giao thần:</strong> “Lời hứa thì ai cũng có thể nói. Ngươi định làm gì để chứng minh?”</p></div><p>Bích Châu nhận ra mình cần đưa ra một giải pháp cụ thể.</p>`,
        choices: [
          { title: "Đề xuất giao ước bảo vệ biển", desc: "Cam kết giảm khai thác và khắc phục tổn hại.", label: "A", next: "a2", action: () => { state.covenant = true; state.trust += 2; } },
          { title: "Hứa sẽ thay đổi", desc: "Xin thêm thời gian dù chưa có kế hoạch cụ thể.", label: "B", next: "a2", action: () => { state.trust -= 1; } }
        ]
      },
      a2: {
        stage: 2, chapter: "Giai đoạn 2 · Nhánh A", pill: "Thử thách", speaker: "Giao Thần",
        title: "Chứng minh bằng hành động",

        text: `<p>Bích Châu đứng trước Giao thần. Sau lưng nàng là dân làng đang chờ đợi; trước mặt nàng là biển cả đang nổi giận.</p><div class="dialogue"><p><strong>Giao thần:</strong> “Lời nói không thể xóa bỏ những tổn thương mà con người gây ra. Đây là cơ hội cuối cùng của ngươi.”</p></div><p>Bích Châu cần chọn cách giải quyết xung đột.</p>`,

        ]
      },
      ending_good: {
        stage: 4, chapter: "Giai đoạn 4 · Kết thúc", pill: "Kết thúc tốt", speaker: "Hòa bình vĩnh cửu", ending: true,
        title: "Hòa bình vĩnh cửu",
        text: `<p>Giao thần lắng nghe lời đề nghị của Bích Châu và chấp nhận giao ước.</p><p>Dân làng bắt đầu bảo vệ biển cả, khắc phục những tổn hại đã gây ra. Giao thần cũng hứa không trừng phạt những người vô tội.</p><p>Biển dần trở lại trong xanh. Con người và biển cả học cách chung sống trong sự tôn trọng lẫn nhau.</p><div class="dialogue"><p><strong>Giao thần:</strong> “Can đảm không chỉ là chiến thắng kẻ khác, mà còn là khiến cả hai bên cùng thay đổi.”</p></div><p><strong>Kết quả:</strong> Hòa bình được thiết lập.</p>`
      },
      ending_guardian: {

        title: "Người bảo hộ biển cả",
        text: `<p>Cảm động trước sự chân thành và quyết tâm của Bích Châu, Giao thần trao cho nàng trách nhiệm làm người bảo hộ biển cả.</p><p>Bích Châu trở thành cầu nối giữa con người và thế giới dưới nước. Nàng giúp dân làng hiểu giá trị của biển, đồng thời truyền đạt nỗi đau của con người đến Giao thần.</p><p>Biển cả dần hồi sinh. Hai bên bắt đầu nhìn nhau bằng sự tôn trọng.</p><p><strong>Kết quả:</strong> Bích Châu trở thành người kết nối hai thế giới.</p>`

      },
      ending_fragile: {
        stage: 4, chapter: "Giai đoạn 4 · Kết thúc", pill: "Kết thúc trung lập", speaker: "Hòa bình mong manh", ending: true,
        title: "Hòa bình mong manh",
        text: `<p>Giao thần đồng ý tạm dừng cơn bão và cho dân làng thời gian sửa chữa sai lầm.</p><p>Sóng biển dần lặng xuống. Người dân được trở về nhà, nhưng Giao thần chưa hứa hẹn về tương lai.</p><p>Bích Châu biết rằng nếu không có hành động thực tế, xung đột có thể quay trở lại.</p><p><strong>Kết quả:</strong> Dân làng được cứu tạm thời, nhưng hòa bình chưa bền vững.</p>`

        text: `<p>Bích Châu không thể thuyết phục Giao thần. Những lời nói thiếu thuyết phục và sự thiếu tin tưởng khiến cuộc thương lượng đi vào ngõ cụt.</p><p>Giao thần quay lưng, gọi lên một cơn sóng lớn. Dân làng phải rời bỏ quê hương để tìm nơi trú ẩn.</p><p>Bích Châu hiểu rằng lòng can đảm thôi là chưa đủ; muốn thay đổi số phận, con người cần có trách nhiệm và hành động cụ thể.</p><p><strong>Kết quả:</strong> Cuộc đàm phán thất bại.</p>`
      },
      ending_sacrifice: {

        text: `<p>Khi nhận ra Giao thần sẽ không dừng cơn bão, Bích Châu quyết định lấy chính mình làm vật bảo đảm cho lời hứa của con người.</p><p>Trước sự chân thành của nàng, Giao thần cuối cùng cũng dừng cơn bão. Dân làng được cứu, nhưng Bích Châu phải ở lại với biển cả để giữ lời giao ước.</p><p>Nhiều năm sau, mỗi khi nhìn thấy biển xanh, người dân vẫn kể cho con cháu nghe về lòng dũng cảm và sự hy sinh của nàng.</p><p><strong>Kết quả:</strong> Dân làng được cứu, nhưng Bích Châu phải trả giá bằng tự do của mình.</p>`

    function resolveEnding() {
      if (state.covenant && state.trust >= 4 && state.support && state.evidence) return "ending_guardian";
      if (state.covenant && state.trust >= 3 && (state.support || state.evidence)) return "ending_good";
      if (state.covenant && state.trust >= 1) return "ending_conditional";
      if (state.temporary && state.trust >= 1) return "ending_fragile";
      if (state.brave && state.trust <= 0) return "ending_sacrifice";
      return "ending_bad";
    }

    // HIỂN THỊ CHỈ SỐ BÓNG TRÒN
    function renderPips() {
      const trustContainer = document.getElementById("dots-trust");
      trustContainer.innerHTML = "";
      const trustScore = Math.max(0, Math.min(5, state.trust + 1));
      for (let i = 0; i < 5; i++) {
        const dot = document.createElement("span");
        dot.className = `dot ${i < trustScore ? 'active-gold' : ''}`;
        trustContainer.appendChild(dot);
      }

      const evidenceContainer = document.getElementById("dots-evidence");
      evidenceContainer.innerHTML = "";
      for (let i = 0; i < 5; i++) {
        const dot = document.createElement("span");
        dot.className = `dot ${state.evidence ? 'active-blue' : ''}`;
        evidenceContainer.appendChild(dot);
      }

      const supportContainer = document.getElementById("dots-support");
      supportContainer.innerHTML = "";
      for (let i = 0; i < 5; i++) {
        const dot = document.createElement("span");
        dot.className = `dot ${state.support ? 'active-green' : ''}`;
        supportContainer.appendChild(dot);
      }

      document.getElementById("back-btn").style.opacity = state.history.length === 0 ? "0.4" : "1";
    }

    // HIỆU ỨNG ÂM THANH CLICK
    function playClickSound() {
      if (!audioEnabled) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.value = 650;
        osc.type = "sine";
        gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.1);
      } catch (e) {}
    }

    // RENDER PASSAGE
    function render(passageId, saveHistory = true) {
      if (passageId === "resolve") {
        passageId = resolveEnding();
      }
      if (saveHistory && state.passage !== passageId) {
        state.history.push(state.passage);
      }
      state.passage = passageId;
      const passage = passages[passageId];

      // Đổi ảnh hiển thị
     const imgSrc = sceneImages[passageId] || sceneImages.start;
      const charImg = document.getElementById("char-img");
      const stageEl = document.querySelector(".stage");

      charImg.src = imgSrc;

      // Nếu cảnh này hiển thị ảnh Bích Châu thì chuyển sang bên trái
      stageEl.classList.remove("align-left", "align-right");
if (imgSrc.includes("bich_chau")) {
        stageEl.classList.add("align-left");   // Bích Châu: BÊN TRÁI
      } else if (imgSrc.includes("giao_than")) {
        stageEl.classList.add("align-right");  // Giao Thần: BÊN PHẢI
      }

      // Nội dung hội thoại
      document.getElementById("speaker-name").textContent = passage.speaker || "Giao Thần";
      document.getElementById("chapter-name").textContent = passage.chapter;
      document.getElementById("dialogue-body").innerHTML = passage.text;

      // Menu lựa chọn
      const choicesOverlay = document.getElementById("choices-menu");
      choicesOverlay.innerHTML = "";

      if (passage.ending) {
        const btn = document.createElement("div");
        btn.className = "choice-card";
        btn.innerHTML = `<span class="choice-badge">↺</span><div class="choice-info"><strong>Chơi lại từ đầu</strong><small>Thử con đường khác để khám phá số phận mới.</small></div>`;
        btn.onclick = () => {
          playClickSound();
          restartGame();
        };
        choicesOverlay.appendChild(btn);
      } else if (passage.choices) {
        passage.choices.forEach((c) => {
          const btn = document.createElement("div");
          btn.className = "choice-card";
          btn.innerHTML = `<span class="choice-badge">${c.label}</span><div class="choice-info"><strong>${c.title}</strong><small>${c.desc}</small></div>`;
          btn.onclick = (e) => {
            e.stopPropagation();
            playClickSound();
            if (c.action) c.action();
            choicesOverlay.classList.add("hidden");
            render(c.next);
          };
          choicesOverlay.appendChild(btn);
        });
      }

      renderPips();
    }

    // Mở overlay lựa chọn khi click vào khung thoại
    document.getElementById("dialogue-box").addEventListener("click", () => {
      const choicesOverlay = document.getElementById("choices-menu");
      if (choicesOverlay.children.length > 0) {
        choicesOverlay.classList.remove("hidden");
      }
    });

    function restartGame() {
      state = initialState();
      document.getElementById("hero-layer").classList.remove("hidden");
      document.getElementById("choices-menu").classList.add("hidden");
      render("start", false);
    }

    // SỰ KIỆN GIAO DIỆN
    const heroLayer = document.getElementById("hero-layer");
    const bgAudio = document.getElementById("bg-audio");

    document.getElementById("start-game-btn").addEventListener("click", () => {
      playClickSound();
      heroLayer.classList.add("hidden");
      render("start", false);
      if (audioEnabled) {
        bgAudio.volume = 0.35;
        bgAudio.play().catch(() => {});
      }
    });

    document.getElementById("home-btn").addEventListener("click", () => {
      playClickSound();
      restartGame();
    });

    document.getElementById("back-btn").addEventListener("click", () => {
      if (!state.history.length) return;
      playClickSound();
      document.getElementById("choices-menu").classList.add("hidden");
      const prev = state.history.pop();
      render(prev, false);
    });

    const audioBtn = document.getElementById("audio-toggle");
    audioBtn.addEventListener("click", () => {
      audioEnabled = !audioEnabled;
      if (audioEnabled) {
        audioBtn.textContent = "🔊 Nhạc";
        bgAudio.play().catch(() => {});
      } else {
        audioBtn.textContent = "🔇 Tắt";
        bgAudio.pause();
      }
    });

    document.getElementById("fs-btn").addEventListener("click", () => {
      if (!document.fullscreenElement) {
        document.getElementById("game-screen").requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen();
      }
    });

    // Khởi tạo trạng thái pips ban đầu
    renderPips();
  </script>
